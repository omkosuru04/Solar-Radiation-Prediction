<!DOCTYPE html>
<html>
<head>
    <title>Solar Radiation Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #f9d423, #ff4e50);
            color: #333;
            text-align: center;
            margin-top: 50px;
        }
        form {
            display: inline-block;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        input {
            width: 200px;
            padding: 8px;
            margin: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            background: #ff4e50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
        h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>☀️ Solar Radiation Prediction</h1>
    <form method="post" action="/predict">
        <input type="number" step="any" name="temperature" placeholder="Temperature (°C)" required><br>
        <input type="number" step="any" name="pressure" placeholder="Pressure (hPa)" required><br>
        <input type="number" step="any" name="humidity" placeholder="Humidity (%)" required><br>
        <input type="number" step="any" name="speed" placeholder="Speed (m/s)" required><br>
        <input type="number" step="any" name="wind_direction" placeholder="Wind Direction (°)" required><br>
        <button type="submit">Predict</button>
    </form>

    {% if result is defined %}
        <h2>☀️ Predicted Solar Radiation: {{ result }} W/m²</h2>
    {% endif %}
</body>
</html>
